services:
  ops-pilot:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AGENT_MODE: langgraph
      KNOWLEDGE_RETRIEVER: candidate
      DEEPSEEK_API_KEY: ""
      DATABASE_PATH: data/ops_pilot.db
      DEMO_AUTH_FILE: data/demo-auth.json
    volumes:
      - demo-data:/opt/ops-pilot/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  demo-data:
